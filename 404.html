<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF6EC">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:image" content="https://animedel.no/og-image.png">
<meta name="twitter:image" content="https://animedel.no/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<title>Siden finnes ikke — Animedel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF6EC;--terracotta:#E07A5F;--sage:#81B29A;--brown:#3D2C2E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--brown)}
body{
  font-family:Nunito,system-ui,sans-serif;line-height:1.55;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;
  background:radial-gradient(ellipse at 20% 10%,rgba(224,122,95,.12),transparent 50%),
             radial-gradient(ellipse at 90% 80%,rgba(129,178,154,.14),transparent 45%),
             var(--cream);
}
main{width:100%;max-width:36rem}
.brand{font-family:Fredoka,Nunito,sans-serif;font-size:1.5rem;font-weight:700;margin:0;color:var(--terracotta);text-decoration:none}
.rubro{margin:.2rem 0 0;color:var(--brown);opacity:.7;font-size:.95rem}
.code{font-family:Fredoka,Nunito,sans-serif;font-size:clamp(4.5rem,18vw,7rem);line-height:1;font-weight:700;color:var(--terracotta);margin:2rem 0 .5rem}
h1{font-family:Fredoka,Nunito,sans-serif;font-weight:700;margin:0 0 .5rem;font-size:1.8rem;color:var(--brown)}
p{margin:0 0 1rem}
.actions{margin-top:1.75rem;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem}
.btn{
  display:inline-block;background:var(--terracotta);color:#fff;text-decoration:none;
  padding:.85rem 1.5rem;border-radius:14px;font-weight:700;text-align:center;
}
.btn:hover,.btn:focus-visible{background:#c9684f}
.actions a:not(.btn){color:var(--brown);text-decoration-color:var(--sage);text-underline-offset:3px}
.actions a:not(.btn):hover{color:var(--terracotta)}
a:focus-visible{outline:2px solid var(--terracotta);outline-offset:3px}
.contact{color:var(--brown);opacity:.75;font-size:.95rem}
.contact a{color:var(--terracotta)}
@media (max-width:480px){.actions{flex-direction:column;align-items:stretch}.btn{width:100%}}
</style>
<meta name="twitter:title" content="Siden finnes ikke — Animedel">
</head>
<body>
<main>
<a class="brand" href="/">Animedel</a>
<p class="rubro">For de firbeinte i familien</p>
<div class="code" aria-hidden="true">404</div>
<h1>Siden finnes ikke</h1>
<p>Vi finner ikke denne siden hos Animedel. Den kan være flyttet, eller adressen kan være skrevet feil.</p>
<div class="actions">
<a class="btn" href="/">Til forsiden</a>
<a href="/#shop">Se butikken</a>
<span class="contact">Kontakt: <a href="mailto:kontakt@animedel.no">kontakt@animedel.no</a></span>
</div>
</main>
</body>
</html>
