<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:image" content="https://animedel.no/og-image.png">
<meta name="twitter:image" content="https://animedel.no/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1f4a38">
<title>Siden finnes ikke — Animedel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f1ec;--ink:#1a2e24;--muted:#5a6e63;--line:#c5d6cc;--accent:#e86f3a;--pine:#1f4a38}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:"Nunito",sans-serif;line-height:1.55;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;
  background:radial-gradient(circle at 20% 10%,#f7fbf8,transparent 40%),linear-gradient(160deg,#e8f1ec,#d5e6dc);
}
main{width:100%;max-width:36rem}
.brand{font-family:"Outfit",sans-serif;font-size:1.6rem;font-weight:800;margin:0;color:var(--pine);text-decoration:none;letter-spacing:-.02em}
.rubro{margin:.15rem 0 0;color:var(--muted);font-size:.95rem}
.code{font-family:"Outfit",sans-serif;font-size:clamp(4.5rem,18vw,7rem);line-height:1;font-weight:800;color:var(--pine);margin:2rem 0 .5rem;letter-spacing:-.04em}
h1{font-family:"Outfit",sans-serif;font-weight:800;margin:0 0 .5rem;font-size:1.8rem;color:var(--pine)}
p{margin:0 0 1rem;color:var(--muted)}
.actions{margin-top:1.75rem;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem}
.btn{display:inline-block;background:var(--accent);color:#fffdf9;text-decoration:none;padding:.8rem 1.4rem;border-radius:14px;font-weight:800;text-align:center}
.btn:hover,.btn:focus-visible{filter:brightness(1.05)}
.actions a:not(.btn){color:var(--pine);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.contact{color:var(--muted);font-size:.95rem}
@media (max-width:480px){.actions{flex-direction:column;align-items:stretch}.btn{width:100%}}
</style>
<meta name="twitter:title" content="Siden finnes ikke — Animedel">
</head>
<body>
<main>
<a class="brand" href="/">Animedel</a>
<p class="rubro">Produkter til kjæledyr</p>
<div class="code" aria-hidden="true">404</div>
<h1>Siden finnes ikke</h1>
<p>Vi finner ikke denne siden hos Animedel. Den kan være flyttet, eller adressen kan være skrevet feil.</p>
<div class="actions">
<a class="btn" href="/">Til forsiden</a>
<a href="/#shop">Se produktene</a>
<span class="contact">Kontakt: <a href="mailto:kontakt@animedel.no">kontakt@animedel.no</a></span>
</div>
</main>
</body>
</html>
